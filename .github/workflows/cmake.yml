name: CMake Build & Test

on: [push, pull_request]

concurrency:
  group: cmake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Prepare pinned Vulkan SDK components
      uses: humbletim/setup-vulkan-sdk@v1.2.1
      with:
        vulkan-query-version: 1.4.304.1
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true
        
    - name: Configure CMake
      run: cmake -B build -S .
      
    - name: Build
      run: cmake --build build --config Debug

    # Keep the public standalone-game promise honest. This named build makes a
    # missing/disabled example target fail loudly instead of being hidden by a
    # successful editor build.
    - name: Verify standalone example target
      run: cmake --build build --config Debug --target phyxel_minimal_game
      
    - name: Test
      run: ctest --test-dir build -C Debug --output-on-failure

    - name: Test project creation and packaging tools
      run: >-
        python -m pytest
        tests/test_create_project.py
        tests/test_package_game.py
        tests/test_smoke_test_standalone.py
        tests/test_produce_game.py
        -q
